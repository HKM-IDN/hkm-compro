# Build situs statis lalu deploy ke GitHub Pages.
#
# Nilai konfigurasi diambil dari Settings → Secrets and variables → Actions
# (tab "Variables" atau "Secrets", level repo maupun environment "github-pages").
# Wajib: SANITY_PROJECT_ID. Sisanya opsional (lihat .env.example).
# Nama lama berawalan NEXT_PUBLIC_ juga diterima sebagai cadangan.
name: Deploy ke GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # tombol "Run workflow" manual — berguna setelah konten Sanity diubah

permissions:
  contents: read
  pages: write
  id-token: write

# Satu deploy saja dalam satu waktu; deploy yang sedang jalan tidak dibatalkan.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Build + deploy dalam satu job, supaya variable di environment "github-pages" ikut terbaca saat build.
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      SANITY_PROJECT_ID: ${{ vars.SANITY_PROJECT_ID || secrets.SANITY_PROJECT_ID || vars.NEXT_PUBLIC_SANITY_PROJECT_ID || secrets.NEXT_PUBLIC_SANITY_PROJECT_ID }}
      SANITY_DATASET: ${{ vars.SANITY_DATASET || vars.NEXT_PUBLIC_SANITY_DATASET || 'production' }}
      SANITY_API_VERSION: ${{ vars.SANITY_API_VERSION || vars.NEXT_PUBLIC_SANITY_API_VERSION || '2024-01-01' }}
      SITE_URL: ${{ vars.SITE_URL || vars.NEXT_PUBLIC_SITE_URL || 'https://hkm.co.id' }}
      GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID || vars.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
      GOOGLE_MAPS_API_KEY: ${{ vars.GOOGLE_MAPS_API_KEY || vars.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
      FORMSPREE_CONTACT_ENDPOINT: ${{ vars.FORMSPREE_CONTACT_ENDPOINT || vars.NEXT_PUBLIC_FORMSPREE_CONTACT_ENDPOINT }}
    steps:
      # Hanya menampilkan "ada"/"kosong", nilainya tidak pernah dicetak.
      - name: Cek variable
        run: |
          for v in SANITY_PROJECT_ID SANITY_DATASET SITE_URL GA_MEASUREMENT_ID GOOGLE_MAPS_API_KEY FORMSPREE_CONTACT_ENDPOINT; do
            if [ -n "${!v}" ]; then echo "$v: ada"; else echo "$v: KOSONG"; fi
          done
          if [ -z "$SANITY_PROJECT_ID" ]; then
            echo "::error::SANITY_PROJECT_ID kosong. Isi di Settings → Secrets and variables → Actions → Variables (nama persis SANITY_PROJECT_ID)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Memberi base_path: "/hkm-compro" di github.io, kosong kalau pakai custom domain.
      - id: pages
        uses: actions/configure-pages@v5

      - run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
